<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A repository-grounded AUTOSAR verification command center with modeled OEM variants</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="deck">
  <nav class="nav" id="nav" aria-label="Slides"></nav>

  <main class="stage">
    <div class="slide" id="slide">
      <header class="slide-head">
        <span class="micro">APTIV X COGNITION</span>
        <span class="micro" id="slide-date">SEP 2026</span>
      </header>
      <div class="context-bar">
        <div class="legend" id="legend"></div>
        <div class="runbar" id="runbar"></div>
      </div>
      <h1 class="slide-title" id="slide-title">Current State &amp; Challenges</h1>
      <div class="slide-body" id="slide-body"></div>
      <footer class="slide-foot">
        <span class="wordmark"><span class="wordmark-glyph">❋</span> Cognition</span>
        <span class="foot-center">Proprietary &amp; Confidential</span>
        <span class="foot-right micro" id="foot-right"></span>
      </footer>
    </div>
  </main>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-inner">
    <div class="drawer-head">
      <div>
        <div class="micro" id="drawer-kind"></div>
        <div class="drawer-title" id="drawer-title"></div>
        <div class="drawer-path" id="drawer-path"></div>
      </div>
      <button class="drawer-close" id="drawer-close" aria-label="Close">×</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
